name: qa-gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  thermo-nuclear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: npm install -g @anthropic-ai/claude-code
      - name: Thermo-nuclear review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "/thermo-nuclear-code-quality-review Review the changes in origin/${{ github.base_ref }}...HEAD." \
            --model opus \
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(wc:*)" \
            | tee review.md
          cat review.md >> "$GITHUB_STEP_SUMMARY"
          # The skill ends with a binary verdict line: PASS or BLOCK.
          grep -E '^\**(PASS|BLOCK)\**' review.md | tail -n 1 | grep -q PASS
