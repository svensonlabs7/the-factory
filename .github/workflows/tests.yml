name: tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      # The same locked environment the adapter runs (pyproject.toml + uv.lock), plus the test group. --locked fails if
      # the lock is stale against pyproject.toml. uv fetches the pinned Python 3.11 itself (python-build-standalone).
      - run: pip install uv==0.13.0
      # The adapter scans every push with gitleaks, so the tests need the real scanner (same pin as static.yml).
      - name: Install gitleaks 8.30.1 (checksum pinned)
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && sudo mv gitleaks /usr/local/bin/
      - run: uv run --locked --group test python -m pytest -q
