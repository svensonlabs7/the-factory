name: watchdog

# The off-machine alert. factory/intake/beacon.sh stamps FACTORY_ALIVE_AT every 10 minutes while the adapter answers.
# This fails when the stamp is over 30 minutes old. GitHub emails a failed scheduled run to whoever last changed this
# schedule, and turns scheduled workflows off after 60 days without repo activity (factory/intake/README.md).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          ALIVE_AT: ${{ vars.FACTORY_ALIVE_AT }}
        run: |
          age=$(( $(date +%s) - ${ALIVE_AT:-0} ))
          echo "the factory last stamped its heartbeat ${age}s ago"
          if [ "$age" -gt 1800 ]; then
            echo "::error::The factory heartbeat is ${age}s old. Check the Mac, the adapter (launchd) and the network."
            exit 1
          fi
