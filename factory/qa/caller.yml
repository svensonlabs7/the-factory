name: qa-gate

# The factory's QA gate for this repo: thermo-nuclear, ponytail-review and ux-laws, run from the factory's own
# workflow, skills and cards at the commit pinned below. pull_request_target runs this file from the default branch, so
# a PR cannot edit the gate that reviews it. To move to a newer gate, change the pinned commit.
# It needs the CLAUDE_CODE_OAUTH_TOKEN repo secret.
on:
  pull_request_target:
    branches: [__BRANCH__]

permissions:
  contents: read

jobs:
  gate:
    uses: svensonlabs7/the-factory/.github/workflows/qa-gate.yml@__SHA__
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
